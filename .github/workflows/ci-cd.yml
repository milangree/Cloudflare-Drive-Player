name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  # 阶段 1: 质量与安全性检查闸门
  quality-gate:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run JavaScript Syntax & Static Check
        run: npm run test:syntax

      - name: Run Production Dependency Vulnerability Gate
        # 生产运行时依赖高危漏洞阻断门禁 (运行时 Zero Dependencies 强制保障)
        run: npm audit --omit=dev --audit-level=high

      - name: Run Toolchain Dependency Advisory (Non-blocking)
        # 开发脚手架依赖安全扫描与预警
        run: npm audit || true

  # 阶段 2: 部署到 Cloudflare Pages (分支环境或生产环境)
  deploy:
    name: Deploy to Cloudflare Pages
    needs: quality-gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Deploy to Cloudflare Pages (Preview / Production)
        id: pages-deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=cf-pages-drive-player ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && '--branch=main' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post-deploy Anycast Smoke Test / Healthcheck
        run: |
          DEPLOY_URL="${{ steps.pages-deploy.outputs.deployment-url }}"
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="https://cf-pages-drive-player.pages.dev"
            echo "Deployment URL not captured from action output, falling back to production alias: $DEPLOY_URL"
          fi
          echo "Executing post-deploy edge healthcheck against $DEPLOY_URL..."
          node scripts/healthcheck.js "$DEPLOY_URL"
