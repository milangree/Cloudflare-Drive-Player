name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  # 阶段 1: 质量与安全性检查闸门
  quality-gate:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Offline Functions Bundle Gate (wrangler)
        # 打包期闸门：npm run test:syntax 只做 node --check 的 AST 语法解析，
        # 不解析 import 说明符，相对路径写错要到 wrangler 打包阶段才会暴露
        # （参见 run 39885824930：functions/api/telegram/webhook.js 导入层级错误）。
        # 该步骤完全离线执行，不需要任何 Cloudflare 凭据，也不会触发部署。
        run: npx wrangler pages functions build --outdir="$RUNNER_TEMP/functions-build"

      - name: Run JavaScript Syntax & Static Check
        run: npm run test:syntax

      - name: Run Module Resolution & Contract Test
        # 真实断言门禁：npm run test:syntax 只做 node --check 的 AST 解析，
        # 无法发现 import 说明符写错（run 39885824930 的漏检根因）。
        # 本步骤用 node:test 真实 import 每个 functions 模块并校验错误契约。
        run: npm test

      - name: Run Production Dependency Vulnerability Gate
        # 生产运行时依赖高危漏洞阻断门禁 (运行时 Zero Dependencies 强制保障)
        run: npm audit --omit=dev --audit-level=high

      - name: Run Toolchain Dependency Advisory (Non-blocking)
        # 开发脚手架依赖安全扫描与预警
        run: npm audit || true

      - name: Run Documentation Drift Gate
        # 文档漂移闸门：路由覆盖、中英双语配对、README 目录锚点可解析、关键文档存在性
        run: npm run test:docs

  # 阶段 2: 部署到 Cloudflare Pages (分支环境或生产环境)
  deploy:
    name: Deploy to Cloudflare Pages
    needs: quality-gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Stamp Deploy Version
        # 写入部署版本戳（提交 SHA + UTC 构建时间），随静态资源一同部署，便于线上溯源
        run: |
          mkdir -p public
          printf '{"version":"%s","builtAt":"%s"}\n' "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/version.json
          echo "Stamped public/version.json -> $(cat public/version.json)"

      - name: Deploy to Cloudflare Pages (Preview / Production)
        id: pages-deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=cf-pages-drive-player ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && '--branch=main' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post-deploy Anycast Smoke Test / Healthcheck
        run: |
          DEPLOY_URL="${{ steps.pages-deploy.outputs.deployment-url }}"
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="https://cf-pages-drive-player.pages.dev"
            echo "Deployment URL not captured from action output, falling back to production alias: $DEPLOY_URL"
          fi
          echo "Executing post-deploy edge healthcheck against $DEPLOY_URL..."
          node scripts/healthcheck.js "$DEPLOY_URL"

      - name: Verify Deploy Version Stamp
        # 版本戳必须随部署产物下发，用于线上问题溯源
        run: |
          DEPLOY_URL="${{ steps.pages-deploy.outputs.deployment-url }}"
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="https://cf-pages-drive-player.pages.dev"
          fi
          STAMP=$(curl -sf "$DEPLOY_URL/version.json")
          echo "Deployed version stamp: $STAMP"
          if ! echo "$STAMP" | grep -q '"version":"[0-9a-f]\{40\}"'; then
            echo "❌ 部署产物中缺少合法的提交 SHA 版本戳 (public/version.json)"
            exit 1
          fi
          echo "✅ 版本戳校验通过"

  # 阶段 3: 回滚部署（手动触发，重部署任意历史提交以恢复线上）
  rollback:
    name: Rollback Deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Rollback Target Ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rollback_ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Offline Functions Bundle Gate (wrangler)
        run: npx wrangler pages functions build

      - name: Stamp Deploy Version
        run: |
          mkdir -p public
          printf '{"version":"%s","builtAt":"%s"}\n' "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/version.json
          echo "Rollback target: ${GITHUB_SHA} (${{ github.event.inputs.rollback_ref || 'main' }})"

      - name: Deploy Rollback Build to Cloudflare Pages
        id: rollback-deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=cf-pages-drive-player --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Rollback
        run: |
          DEPLOY_URL="${{ steps.rollback-deploy.outputs.deployment-url }}"
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="https://cf-pages-drive-player.pages.dev"
          fi
          echo "Verifying rollback against $DEPLOY_URL..."
          node scripts/healthcheck.js "$DEPLOY_URL"
