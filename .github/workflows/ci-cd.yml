name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  # 阶段 1: 质量与安全性检查闸门
  quality-gate:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run JavaScript Syntax & Static Check
        run: npm run test:syntax

      - name: Run Dependency Vulnerability Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # 阶段 2: 部署到 Cloudflare Pages (分支环境或生产环境)
  deploy:
    name: Deploy to Cloudflare Pages
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Deploy to Cloudflare Pages (Preview / Production)
        id: pages-deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=cf-pages-drive-player ${{ github.ref == 'refs/heads/main' && '--branch=main' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post-deploy Smoke Test / Healthcheck
        if: steps.pages-deploy.outputs.deployment-url != ''
        run: |
          echo "Verifying deployment at ${{ steps.pages-deploy.outputs.deployment-url }}..."
          node scripts/healthcheck.js "${{ steps.pages-deploy.outputs.deployment-url }}"
