name = "cf-pages-drive-player"
compatibility_date = "2024-01-01"
pages_build_output_dir = "public"

# ==============================================================================
# Cloudflare KV 命名空间绑定 (可选配，用于毫秒级加速系统配置与密码读取)
# 
# 使用说明：
# 1. 登录 Cloudflare 控制台创建 KV 命名空间（或执行 npx wrangler kv:namespace create DRIVE_KV）
# 2. 将下方 kv_namespaces 中的 id 与 preview_id 替换为您创建的真实 KV ID
# 3. 在 Cloudflare Pages 后台 Settings -> Functions -> KV namespace bindings 中绑定：
#    - Variable name (变量名): DRIVE_KV
#    - KV namespace: 选择您创建的命名空间
# ==============================================================================
[[kv_namespaces]]
binding = "DRIVE_KV"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_KV_PREVIEW_ID"

