name = "cloudflare-drive-player"
compatibility_date = "2024-01-01"
pages_build_output_dir = "public"

# ==============================================================================
# Cloudflare KV 命名空间绑定 (可选配，用于毫秒级加速系统配置与密码读取)
#
# 【注意】当项目根目录存在 wrangler.toml 时，Cloudflare Pages 会自动接管绑定管理，
# 控制台界面中的手动添加绑定将被锁定。所有的绑定必须在下方文件中直接配置：
#
# 配置步骤：
# 1. 登录 Cloudflare 控制台 -> Workers & Pages -> KV，创建一个命名空间（如 cf-drive-player-kv）
# 2. 复制创建后列表里显示的 Namespace ID（32 位长字符串）
# 3. 将下方 id 替换为您真实的 KV Namespace ID，提交推送到 Git 仓库即可秒级自动生效！
#
# 如果您暂未创建 KV，保持下方注释状态即可，系统会自动使用 Google Drive 元数据进行持久化。
# ==============================================================================

# 若要启用 KV 绑定，请取消下方 3 行的注释并将 id 替换为您在 Cloudflare 创建的真实 KV ID：
# [[kv_namespaces]]
# binding = "DRIVE_KV"
# id = "替换为你的KV命名空间ID_例如_6234abcd5678ef901234567890abcdef"
